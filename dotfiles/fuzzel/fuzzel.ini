# ===================================================================
#                  CONFIGURACIÓN DE FUZZEL (SIX)
# ===================================================================

# Configuración Principal y de Pantalla
output=<not-set>
font=JetBrainsMono Nerd Font:size=12
dpi-aware=auto
prompt="❯ "
icon-theme=hicolor
icons-enabled=yes
fields=filename,name,generic
password-character=*
filter-toggle-key-bindings=yes

# Dimensiones y Posición Centrada
lines=10
width=40
tabs=4
horizontal-pad=20
vertical-pad=15
inner-pad=10

# Bordes y Forma
image-size-ratio=0.5
line-height=24
letter-spacing=0
layer=top
exit-on-keyboard-focus-loss=yes

# Colores - Tema Oscuro (Catppuccin Mocha)
[colors]
background=1e1e2eff        # Gris oscuro base (Mocha)
text=cdd6f4ff              # Texto claro principal
match=f38ba8ff             # Color para las letras que coinciden al escribir (Rojo/Rosa)
selection=313244ff         # Fondo de la línea seleccionada (Gris medio)
selection-text=cdd6f4ff    # Texto de la línea seleccionada
selection-match=f38ba8ff   # Letras coincidentes en la selección
border=b4befe55            # Borde sutil semi-transparente

# Bordes Redondeados del Menú
[border]
width=2
radius=12

# Ajustes de Renderizado
[dmenu]
mode=text
exit-immediately-if-empty=no