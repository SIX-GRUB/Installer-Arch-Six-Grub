# ===================================================================
#                  CONFIGURACIÓN DE HYPRLAND (SIX)
# ===================================================================

# --- Monitores ---
monitor=,preferred,auto,1

# --- Autostart (Programas de inicio) ---
exec-once = hyprpaper
exec-once = waybar
exec-once = hyprpolkitagent
exec-once = mako
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# --- Variables de Entorno ---
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland
env = XCURSOR_SIZE,24

# --- Entrada (Teclado y Mouse) ---
input {
    kb_layout = es        # Cambia a 'us' si tu teclado no tiene la Ñ
    follow_mouse = 1
    sensitivity = 0
}

# --- Estética General ---
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgb(cdd6f4)     # Color claro Mocha para enfoque
    col.inactive_border = rgb(313244)   # Gris oscuro Mocha
    layout = dwindle
    allow_tearing = false
}

# --- Decoración de Ventanas ---
decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.95

    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

# --- Animaciones ---
animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, myBezier
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 5, default
    animation = borderangle, 1, 5, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 4, default
}

# --- Reglas de Ventana (Mosaico Inteligente y Flotantes) ---
dwindle {
    pseudotile = true
    preserve_split = true
}

# Forzar ventanas emergentes y de utilidad a ser flotantes y centradas
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(lxappearance)$
windowrulev2 = float, class:^(file-roller)$
windowrulev2 = center, class:^(pavucontrol)$
windowrulev2 = center, class:^(lxappearance)$
windowrulev2 = center, class:^(file-roller)$

# --- Atajos de Teclado (Keybindings) ---
$mainMod = SUPER

# Gestión de Ventanas
bind = $mainMod, Q, killactive, 
bind = $mainMod, F11, fullscreen, 
bind = $mainMod, Space, togglefloating, 

# Ejecución de Aplicaciones
bind = CTRL, $mainMod, exec, fuzzel                           # Lanzador
bind = $mainMod, P, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy && wl-paste # Portapapeles
bind = $mainMod, Return, exec, ghostty                        # Terminal (Principal)
bind = $mainMod, T, exec, ghostty                             # Terminal (Secundario)
bind = $mainMod, F, exec, thunar                              # Gestor de Archivos
bind = $mainMod SHIFT, M, exec, microsoft-edge-stable         # Navegador
bind = $mainMod SHIFT, O, exec, obsidian                       # Notas
bind = $mainMod SHIFT, X, exec, code                           # VS Code

# Navegación de Foco (Moverse entre ventanas con Super + Flechas)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Navegación de Escritorios (Workspaces 1-5)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# Mover Ventana a un Escritorio
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Mover y Redimensionar con Mouse (Super + Click Izquierdo / Derecho)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- Atajos de Hardware (Teclas Multimedia) ---
binde = , XF86AudioRaiseVolume, exec, pamixer -i 5
binde = , XF86AudioLowerVolume, exec, pamixer -d 5
bind = , XF86AudioMute, exec, pamixer -t
binde = , XF86MonBrightnessUp, exec, brightnessctl set +5%
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-