# ===================================================================
#                CONFIGURACIÓN DE HYPRLOCK (SIX)
# ===================================================================

background {
    monitor =
    path = ~/.config/hypr/wallpaper.png   # Usa tu mismo fondo de pantalla
    blur_passes = 2                       # Difumina el fondo para que resalte la caja
    blur_size = 4
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
}

# Entrada de Contraseña
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.26 # Escala del tamaño de los puntos de entrada
    dots_spacing = 0.15 # Escala del espacio entre los puntos
    dots_center = true
    
    # Colores estilo Mocha
    outer_color = rgb(31, 32, 44)         # Gris oscuro
    inner_color = rgb(48, 52, 70)         # Gris medio
    font_color = rgb(205, 214, 244)       # Texto claro
    
    fade_on_empty = false
    placeholder_text = <i>Introduce tu contraseña...</i>
    hide_input = false
    
    position = 0, -20
    halign = center
    valign = center
}

# Reloj en pantalla (Opcional para la pantalla de bloqueo, bien grande arriba)
label {
    monitor =
    text = $TIME
    color = rgb(205, 214, 244)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    
    position = 0, 80
    halign = center
    valign = center
}